name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -c "import httpx"
          .venv/bin/pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend fixture dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Install, test, build, and verify browser security
        working-directory: frontend
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run build
          npm run test:sandbox-browser
          npm run test:mailbox-browser

  build-push:
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
            name: tmail-api
          - image: frontend
            dockerfile: Dockerfile.frontend
            name: tmail-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [build-push]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy and verify on production host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          TARGET_TAG="sha-${TARGET_SHA:0:7}"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "TARGET_TAG='$TARGET_TAG' TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/tmail

          PREV_IMAGE=$(sudo docker inspect tmail-frontend-1 --format '{{.Config.Image}}' 2>/dev/null || true)
          PREV_TAG="${PREV_IMAGE##*:}"

          rollback() {
            echo "::error::Deployment verification failed; attempting rollback to ${PREV_TAG:-none}"
            if [[ -n "${PREV_TAG:-}" && "$PREV_TAG" != "$TARGET_TAG" ]]; then
              sudo TMAIL_IMAGE_TAG="$PREV_TAG" docker compose -f compose.yaml up -d --wait || true
            fi
          }

          git pull --ff-only origin main
          sudo TMAIL_IMAGE_TAG="$TARGET_TAG" docker compose -f compose.yaml pull

          if ! sudo TMAIL_IMAGE_TAG="$TARGET_TAG" docker compose -f compose.yaml up -d --wait; then
            rollback
            exit 1
          fi

          verify() {
            local fe_rev api_rev fe_http api_http
            fe_rev=$(sudo docker inspect tmail-frontend-1 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            api_rev=$(sudo docker inspect tmail-api-1 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [[ "$fe_rev" == "$TARGET_SHA" ]] || { echo "frontend revision mismatch: $fe_rev != $TARGET_SHA"; return 1; }
            [[ "$api_rev" == "$TARGET_SHA" ]] || { echo "api revision mismatch: $api_rev != $TARGET_SHA"; return 1; }
            fe_http=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)
            api_http=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/domains)
            [[ "$fe_http" == "200" && "$api_http" == "200" ]] || { echo "health check failed: fe=$fe_http api=$api_http"; return 1; }
            echo "Verified revision=${TARGET_SHA} frontend_http=${fe_http} domains_api_http=${api_http}"
          }

          if ! verify; then
            rollback
            exit 1
          fi
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

services:
  api:
    image: ghcr.io/arcrek/tmail-api:${TMAIL_IMAGE_TAG:-latest}
    environment:
      TMAIL_CONFIG: /var/lib/tmail-policy/config.json
      TMAIL_CONFIG_SEED: /run/tmail/config.json
      TMAIL_API_HOST: 0.0.0.0
      TMAIL_API_PORT: "8000"
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - tmail-data:/var/lib/tmail-policy
      - ./config.json:/run/tmail/config.json:ro
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/arcrek/tmail-frontend:${TMAIL_IMAGE_TAG:-latest}
    environment:
      TMAIL_TRUST_FORWARD_HEADERS: ${TMAIL_TRUST_FORWARD_HEADERS:-off}
      NGINX_ENVSUBST_FILTER: "^TMAIL_TRUST_FORWARD_HEADERS$$"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TMAIL_HTTP_BIND:-127.0.0.1}:${TMAIL_HTTP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  tmail-data:
